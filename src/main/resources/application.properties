spring.application.name=book-api

# Uses Render's PORT when deployed, 8080 when running locally
server.port=${PORT:8080}

# Show validation error messages in responses
server.error.include-message=always
server.error.include-binding-errors=always

# ---------- Default (local development): SQLite ----------
# Creates a file called bookapi.db in the folder you run the app from
spring.datasource.url=jdbc:sqlite:bookapi.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# SQLite allows only one writer at a time, so use a single connection
spring.datasource.hikari.maximum-pool-size=1

# Create/update tables automatically from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- CORS ----------
# Frontend URLs allowed to call this API (comma-separated).
# On Render, set the ALLOWED_ORIGINS environment variable to add your frontend URL.
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
